    <link rel="stylesheet" href="styles/interactive.css">

    <link rel="icon" type="image/svg+xml" href="Images/travel-svg.svg" />
</head>
<body>

    <nav class="main-nav">

            <li><a href="interactive.html" class="active">טיול בהתאמה</a></li>
        </ul>
    </nav>
</header>

<main class="mainContainer">
    <form id="tripPlannerForm" class="tripForm" onsubmit="handleSubmit(event)">
        <h2>בנה את חבילת הטיול המושלמת שלך</h2>

        <div class="formGroup">
            <label for="travelerName">שם המטייל: <span class="required">*</span></label>
            <input type="text" id="travelerName" name="travelerName" placeholder="לדוגמה: ליאם" oninput="checkFormValidity()" required>
        </div>

        <div class="formGroup">
            <label>בחר יעד לטיול: <span class="required">*</span></label>
            <div class="radioOptions">
                <label>
                    <input type="radio" name="destination" value="דרום איטליה" onchange="handleDestinationChange(this)">
                    דרום איטליה
                </label>
                <label>
                    <input type="radio" name="destination" value="תאילנד" onchange="handleDestinationChange(this)">
                    תאילנד
                </label>
                <label>
                    <input type="radio" name="destination" value="יוון" onchange="handleDestinationChange(this)">
                    יוון
                </label>
                <label>
                    <input type="radio" name="destination" value="יפן" onchange="handleDestinationChange(this)">
                    יפן
                </label>
            </div>

            <div id="destinationPreview" class="destinationPreviewContainer hidden">
                <img id="destinationImg" src="" alt="תמונת יעד נבחר">
            </div>
        </div>

        <div class="formGroup">
            <label>אטרקציות וחוויות שתרצה לשלב (רשות):</label>
            <div class="attractionsGrid">

                <div class="attractionCard">
                    <label for="attract1">
                        <img id="imgAttract1" src="Images/pizzaItaly.jpg" alt="סיורי אוכל וטעימות" class="attractionImg dimmed">
                        <span>סיורי אוכל וטעימות</span>
                        <input type="checkbox" id="attract1" name="attractions" value="סיורי אוכל וטעימות" onchange="toggleAttractionImage('attract1', 'imgAttract1')">
                    </label>
                </div>

                <div class="attractionCard">
                    <label for="attract2">
                        <img id="imgAttract2" src="Images/nature.jpg" alt="מסלולי טבע ונופים" class="attractionImg dimmed">
                        <span>מסלולי טבע ונופים</span>
                        <input type="checkbox" id="attract2" name="attractions" value="מסלולי טבע ונופים" onchange="toggleAttractionImage('attract2', 'imgAttract2')">
                    </label>
                </div>

                <div class="attractionCard">
                    <label for="attract3">
                        <img id="imgAttract3" src="Images/historyCastel.jpg" alt="אתרים היסטוריים וטירות" class="attractionImg dimmed">
                        <span>אתרים היסטוריים</span>
                        <input type="checkbox" id="attract3" name="attractions" value="אתרים היסטוריים וטירות" onchange="toggleAttractionImage('attract3', 'imgAttract3')">
                    </label>
                </div>

                <div class="attractionCard">
                    <label for="attract4">
                        <img id="imgAttract4" src="Images/beachTh.jpg" alt="חופים ושיט" class="attractionImg dimmed">
                        <span>חופים ושיט</span>
                        <input type="checkbox" id="attract4" name="attractions" value="חופים ושיט" onchange="toggleAttractionImage('attract4', 'imgAttract4')">
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" disabled>אשר חבילה</button>
    </form>
</main>

<div id="summaryModal" class="modal hidden">
    <div class="modalContent">
        <span class="closeBtn" onclick="closeSummaryModal()">×</span>
        <h3>סיכום החבילה שלך</h3>
        <p id="modalText"></p>
        <button type="button" id="modalOkBtn" onclick="closeSummaryModal()">סגור</button>
    </div>
</div>
